name: Release

# Run on main pushes or manually from GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize releases so two pushes cannot publish the same VERSION concurrently.
concurrency:
  group: xdr-agent-release
  cancel-in-progress: false

# Opt into Node.js 24 now to silence the Node.js 20 deprecation warnings from
# actions/checkout, actions/setup-go, actions/upload-artifact, etc.
# Remove once those actions ship native Node.js 24 support (expected mid-2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Stage 1 — Detect the version and whether a release already exists.
  # ────────────────────────────────────────────────────────────────────────────
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version:    ${{ steps.v.outputs.version }}
      tag_exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION file
        id: v
        run: |
          VERSION=$(cat VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || {
            echo 'VERSION must contain a release version, for example 0.4.4.' >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: tag
        run: |
          if git rev-parse "v$(cat VERSION)" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v$(cat VERSION) already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # Stage 2 — Freeze one rules snapshot, then build and test Debian packages
  # for AMD64 and ARM64. Both architectures must pass before publication.
  # ────────────────────────────────────────────────────────────────────────────
  rules:
    name: Freeze latest Forge Core for all release targets
    needs: version
    if: needs.version.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/refresh_yara.py --output release-rules/yara-rules-core.yar
      - run: python3 tools/bundle_yara.py --source release-rules/yara-rules-core.yar
      - uses: actions/upload-artifact@v4
        with:
          name: release-rules
          path: |
            release-rules/yara-rules-core.yar
            internal/detection/malware/bundle/catalog.json
          retention-days: 1

  build-test:
    name: "[Debian/${{ matrix.arch }}] build & smoke-test"
    needs: [version, rules]
    if: needs.version.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}

    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: release-rules
          path: frozen-rules
      - run: |
          mkdir -p yara-forge-core
          cp frozen-rules/release-rules/yara-rules-core.yar yara-forge-core/yara-rules-core.yar
      # Enable QEMU binfmt_misc so the x86_64 runner can execute arm64
      # container images transparently via Docker.
      - name: Set up QEMU (arm64 only)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install host packaging and test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev yara

      # The packaging script runs regression/prevention tests before compiling
      # the target binary. VERSION also becomes its reported runtime version.
      - name: Build Debian package
        run: |
          test "$(cat VERSION)" = "$VERSION"
          bash packaging/deb/build.sh "$VERSION" "${{ matrix.arch }}"

      - name: Verify package version and architecture
        id: pkg
        run: |
          PKG_PATH="dist/xdr-agent_${VERSION}_${{ matrix.arch }}.deb"
          test "$(dpkg-deb -f "$PKG_PATH" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$PKG_PATH" Architecture)" = "${{ matrix.arch }}"
          echo "path=$PKG_PATH" >> "$GITHUB_OUTPUT"

      # Install dependencies and compile the full ruleset on the target CPU.
      - name: Smoke test Debian package
        run: |
          cp "${{ steps.pkg.outputs.path }}" dist/smoke-test-pkg.deb
          docker run --rm --platform "linux/${{ matrix.arch }}" \
            -e EXPECTED_VERSION="$VERSION" \
            -v "${PWD}/dist:/pkg:ro" debian:stable-slim \
            sh -ec '
              apt-get update -qq
              apt-get install -y /pkg/smoke-test-pkg.deb
              test "$(stat -c %a /etc/xdr-agent/opensearch.env)" = 600
              test "$(stat -c %u:%g /etc/xdr-agent/opensearch.env)" = 0:0
              # Reinstall must preserve credentials and enforce their permissions.
              echo "XDR_OPENSEARCH_PASSWORD=installer-test" > /etc/xdr-agent/opensearch.env
              chmod 644 /etc/xdr-agent/opensearch.env
              apt-get install --reinstall -y /pkg/smoke-test-pkg.deb
              grep -qx "XDR_OPENSEARCH_PASSWORD=installer-test" /etc/xdr-agent/opensearch.env
              test "$(stat -c %a /etc/xdr-agent/opensearch.env)" = 600
              test "$(/usr/bin/xdr-agent version)" = "$EXPECTED_VERSION"
              /usr/bin/xdr-agent check-rules
            '

      # Upload the built package so the release job can attach it to the
      # GitHub Release without rebuilding.
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}
          path: ${{ steps.pkg.outputs.path }}
          retention-days: 1

      # Reuse the tested binary to create the release tarball.
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: dist/xdr-agent
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # Stage 3 — Publish the GitHub Release.
  #
  # This job runs ONLY when every build-test matrix entry is green.
  # If either architecture failed, this job is skipped and GitHub
  # marks the overall workflow run as failed — no partial releases.
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [version, build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pull every artifact uploaded by the build-test matrix.
      # merge-multiple: false preserves per-artifact sub-directories.
      - name: Download all packages and binaries
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: false
          path: release-artifacts

      # Build tarballs from the pre-built, already-tested binaries.
      - name: Create binary tarballs
        run: |
          for arch in amd64 arm64; do
            SRC="release-artifacts/binary-${arch}/xdr-agent"
            TAR="release-artifacts/xdr-agent_${VERSION}_linux_${arch}.tar.gz"
            cp "${SRC}" release-artifacts/xdr-agent
            tar -czf "${TAR}" -C release-artifacts xdr-agent
            rm release-artifacts/xdr-agent
            echo "Created tarball: ${TAR}"
          done

      # Tag the exact commit that passed all tests.
      - name: Create and push release tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ needs.version.outputs.version }}"

      # Publish the GitHub Release, attaching both Debian packages and binary tarballs.
      # generate_release_notes: true auto-populates from merged PR titles.
      # fail_on_unmatched_files: true prevents a silent empty-files release.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: xdr-agent v${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*.deb
            release-artifacts/**/*.tar.gz
            release-artifacts/release-rules/internal/detection/malware/bundle/catalog.json
